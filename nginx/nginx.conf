server {
    listen 80;
    server_name namlong-asia.com www.namlong-asia.com;

    # Redirect toàn bộ HTTP sang HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name namlong-asia.com www.namlong-asia.com;

    root /var/www/nam-long-asia;   # nếu là Laravel/CI thì sửa thành /var/www/nam-long-asia/public
    index index.php index.html index.htm;

    ssl_certificate /etc/letsencrypt/live/namlong-asia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/namlong-asia.com/privkey.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}